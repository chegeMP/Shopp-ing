# Local Postgres for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mabei
      POSTGRES_PASSWORD: mabei
      POSTGRES_DB: mabei-shop
    volumes:
      - mabei_pgdata:/var/lib/postgresql/data

volumes:
  mabei_pgdata:
